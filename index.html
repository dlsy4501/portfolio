<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>임세윤 포트폴리오</title>
<meta name="description" content="임세윤 포트폴리오 — 시선이 닿지 않는 곳에, 느낄 수 있는 길을 냅니다. Lumo, 디딤, 4D 햅틱 인터페이스 외.">
<meta property="og:title" content="임세윤 포트폴리오"><meta property="og:description" content="임세윤 포트폴리오 — 시선이 닿지 않는 곳에, 느낄 수 있는 길을 냅니다. Lumo, 디딤, 4D 햅틱 인터페이스 외."><meta property="og:type" content="website">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* Layout: 작품이 먼저 보이는 편집형 구성. 배경 60 : 보조 면 30 : 포인트 10.
   레이아웃은 네 가지(큰 미디어+2단 글, 좌우 분할, 목록 행, 정의 행)를 섞어 쓰고 카드는 쓰지 않는다. */
:root{
  --bg:#f6f7f9; --sub:#e9ecf1; --fg:#171b23; --muted:#576070; --line:#d3d8e0;
  --accent:#d1361d; --sel:#f6d3cc;
  --font:"Pretendard Variable",Pretendard,"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#12151b; --sub:#1b2029; --fg:#e9ebf0; --muted:#9aa3b2; --line:#2b323d; --accent:#ff6f52; --sel:#5a2a22; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12151b; --sub:#1b2029; --fg:#e9ebf0; --muted:#9aa3b2; --line:#2b323d; --accent:#ff6f52; --sel:#5a2a22; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:17px;line-height:1.75;word-break:keep-all;overflow-wrap:break-word;padding:0}
::selection{background:var(--sel);color:var(--fg)}
html{scrollbar-color:var(--line) var(--bg)}
a{color:inherit;text-underline-offset:.25em;text-decoration-thickness:1px}
a:hover{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:2px}
.in{max-width:1040px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.band{background:var(--sub)}
header.top{display:flex;justify-content:space-between;align-items:center;gap:16px;padding-block:22px}
.brand{font-weight:700;font-size:18px;text-decoration:none}
.nav{display:flex;gap:24px;font-size:15px;color:var(--muted)}
.nav a{text-decoration:none}
h1{font-size:clamp(34px,6vw,62px);line-height:1.18;letter-spacing:-.035em;font-weight:700;margin:0;text-wrap:balance}
h2{font-size:clamp(24px,3.4vw,32px);line-height:1.3;letter-spacing:-.025em;font-weight:700;margin:0;text-wrap:balance}
h3{font-size:19px;line-height:1.4;margin:0;font-weight:700;letter-spacing:-.01em}
p{margin:0}
.lead{font-size:19px;color:var(--muted);max-width:34em;margin-top:24px}
.hero{padding-block:72px 64px}
.hero h1{animation:rise .7s cubic-bezier(.2,.7,.2,1)}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.rows{margin-top:48px;border-top:1px solid var(--line)}
.row{display:grid;grid-template-columns:7em minmax(0,1fr);gap:4px 24px;padding-block:14px;border-bottom:1px solid var(--line);align-items:baseline}
.row dt{color:var(--muted);font-size:15px}
.row dd{margin:0}
.row dd b{font-weight:700}
.row dd span{color:var(--muted);font-size:15px;margin-left:.5em}
section.pad{padding-block:80px}
.sechead{display:flex;justify-content:space-between;align-items:baseline;gap:16px;margin-bottom:40px}
.muted{color:var(--muted)}
.small{font-size:15px}
.shots{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:24px 20px}
.shots figure{margin:0}
.shots img{width:100%;aspect-ratio:4/3;object-fit:contain;border-radius:6px;display:block;background:var(--sub)}
.shots figcaption{font-size:14px;color:var(--muted);margin-top:8px;line-height:1.5}
.media{background:var(--sub);border-radius:6px;aspect-ratio:16/9;display:flex;align-items:center;justify-content:center;text-align:center;padding:16px;color:var(--muted);font-size:15px;width:100%}
.band .media{background:var(--bg)}
.cover{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:6px;display:block;background:var(--sub)}
.cover.contain{object-fit:contain}
body.clean a.work.nocover.w2{grid-template-columns:minmax(0,1fr)}
a.work{display:block;text-decoration:none;color:inherit}
a.work:hover h3,a.work:hover h2{color:var(--accent)}
/* 대표 1: 큰 미디어 위, 아래 2단 글 */
.w1 .txt{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);gap:24px 56px;margin-top:28px}
.w1 h2{margin-bottom:12px}
.stack{display:grid;gap:4px;font-size:15px;color:var(--muted)}
.stack b{color:var(--fg);font-weight:500}
/* 대표 2: 좌우 분할 */
a.work.w2{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);gap:24px 48px;align-items:center;padding-block:48px;border-top:1px solid var(--line)}
a.work.w2.rev{grid-template-columns:minmax(0,2fr) minmax(0,3fr)}
a.work.w2.rev .cover,a.work.w2.rev .media{order:2}
a.work.w2:first-child{border-top:0;padding-top:8px}
.w2 .stack{margin-top:20px}
.w2 h2{margin-bottom:12px}
/* 그 밖의 프로젝트: 목록 행 */
.list a{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,2fr) 8.5em;gap:4px 28px;align-items:baseline;padding-block:18px;border-top:1px solid var(--line);text-decoration:none}
.list a:last-child{border-bottom:1px solid var(--line)}
.list a:hover h3{color:var(--accent)}
.list .yr{font-size:15px;color:var(--muted);white-space:nowrap;text-align:right}
.skills .row{grid-template-columns:7em minmax(0,1fr)}
footer.end{padding-block:40px;display:flex;justify-content:space-between;gap:12px 24px;flex-wrap:wrap;font-size:15px;color:var(--muted)}
button.link{font:inherit;color:inherit;background:none;border:0;padding:0;text-decoration:underline;text-underline-offset:.25em;cursor:pointer}
button.link:hover{color:var(--accent)}
/* 상세 */
.back{display:inline-block;font-size:15px;color:var(--muted);text-decoration:none;padding-block:8px}
.dhead{padding-block:40px 56px}
.dhead h1{font-size:clamp(32px,5.2vw,52px)}
.dhead .lead{margin-top:20px}
.sec{display:grid;grid-template-columns:11em minmax(0,1fr);gap:12px 40px;padding-block:44px;border-top:1px solid var(--line)}
.sec>h2{font-size:19px;letter-spacing:-.01em;line-height:1.5}
.body{max-width:42em;display:grid;gap:14px}
.body ul{margin:0;padding-left:1.2em;display:grid;gap:10px}
.body code{font-size:.92em;background:var(--sub);padding:.1em .35em;border-radius:3px}
.cols{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px 32px;max-width:none}
.cols h3{font-size:17px;margin-bottom:4px;color:var(--accent)}
.cols p{font-size:16px;color:var(--muted)}
.res{display:grid;gap:10px;max-width:none}
.res li{list-style:none}
.res b{font-size:20px;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.res ul{padding:0}
.tw{overflow-x:auto;max-width:44em}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{padding:10px 14px 10px 0;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap;font-variant-numeric:tabular-nums}
th:first-child,td:first-child{text-align:left}
th{font-weight:500;color:var(--muted)}
.bars{display:grid;gap:10px;max-width:44em}
.bar{display:grid;grid-template-columns:5em 1fr 5.5em;gap:12px;align-items:center;font-size:15px;font-variant-numeric:tabular-nums}
.bar i{display:block;height:10px;background:var(--accent);border-radius:2px;min-width:2px}
.bar span:last-child{text-align:right}
.pair{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px;max-width:none}
.memo{background:var(--sub);border-radius:6px;padding:16px 18px;font-size:15px;color:var(--muted);max-width:42em;margin-bottom:56px}
.memo b{color:var(--fg)}
.tag{display:inline-block;font-size:13px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:3px 10px;margin:0 6px 6px 0}
.next{display:block;text-decoration:none;border-top:1px solid var(--line);padding-block:32px 8px}
.next small{display:block;font-size:15px;color:var(--muted)}
.next h2{margin-top:4px}
.next:hover h2{color:var(--accent)}
body.clean .memo,body.clean .media{display:none}
@media (max-width:760px){
  body{font-size:16px}
  .hero{padding-block:48px 40px}
  .w1 .txt,.w2{grid-template-columns:minmax(0,1fr)}
  a.work.w2,a.work.w2.rev{grid-template-columns:minmax(0,1fr);padding-block:36px}
  a.work.w2.rev .cover,a.work.w2.rev .media{order:0}
  .list a{grid-template-columns:minmax(0,1fr)}
  .sec{grid-template-columns:minmax(0,1fr);padding-block:32px}
  .cols{grid-template-columns:minmax(0,1fr)}
  .row{grid-template-columns:5.5em minmax(0,1fr);gap:4px 16px}
  section.pad{padding-block:56px}
}
@media (prefers-reduced-motion:reduce){.hero h1{animation:none}}
/* 그림·파이프라인 */
.sec.wide{grid-template-columns:minmax(0,1fr);gap:20px}
.sec.wide .body{max-width:none}
.fig{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--line);border-radius:8px;padding:12px}
.fig svg{display:block;width:100%;min-width:780px;height:auto}
.fighint{display:none;font-size:13px;color:var(--muted)}
.d-band{fill:var(--sub)}
.d-box{fill:var(--bg);stroke:var(--line);stroke-width:1.2}
.d-me{fill:var(--bg);stroke:var(--accent);stroke-width:2.2}
.d-grp{fill:none;stroke:var(--line);stroke-width:1.2;stroke-dasharray:5 4}
.d-grpme{fill:none;stroke:var(--accent);stroke-width:1.6;stroke-dasharray:6 4}
.d-dash{fill:var(--bg);stroke:var(--muted);stroke-width:1.2;stroke-dasharray:4 3}
.d-t{fill:var(--fg);font:600 14px var(--font)}
.d-s{fill:var(--muted);font:12px var(--font)}
.d-l{fill:var(--muted);font:600 12px var(--font);letter-spacing:.02em}
.d-la{fill:var(--accent);font:600 12px var(--font);letter-spacing:.02em}
.d-a{stroke:var(--muted);stroke-width:1.5;fill:none}
.d-ad{stroke-dasharray:5 4}
.d-ah{fill:var(--muted)}
.chain{display:flex;gap:8px;align-items:stretch;max-width:none}
.chain .st{flex:1 1 0;min-width:0;background:var(--sub);border-radius:6px;padding:12px 14px}
.chain .st b{display:block;font-size:15px;line-height:1.4}
.chain .st span{display:block;margin-top:4px;font-size:13.5px;line-height:1.5;color:var(--muted)}
.chain .st.me{box-shadow:inset 0 0 0 2px var(--accent)}
.chain .ar{align-self:center;color:var(--muted);font-size:15px;flex:none}
.chain .ar::before{content:"→"}
.stk{display:flex;height:36px;border-radius:4px;overflow:hidden;max-width:44em;background:var(--sub)}
.stk i{display:flex;align-items:center;justify-content:center;font-style:normal;font-size:13px;font-weight:600;color:var(--bg);white-space:nowrap;overflow:hidden;font-variant-numeric:tabular-nums}
.stk .a,.lg .a{background:var(--accent)}
.stk .b,.lg .b{background:var(--muted)}
.stk .c,.lg .c{background:var(--line)}
.lg{display:flex;flex-wrap:wrap;gap:6px 20px;font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums;max-width:44em}
.lg span{display:inline-flex;align-items:center;gap:8px}
.lg em{display:inline-block;width:10px;height:10px;border-radius:2px}
.lg b{color:var(--fg);font-weight:600}
.bargroup{display:grid;gap:8px}
@media (max-width:760px){
  .fighint{display:block}
  .chain{flex-direction:column}
  .chain .ar::before{content:"↓"}
}
</style>
</head>

<div id="app"></div>

<script>
/* 프로젝트 내용은 여기 데이터만 고치면 된다. [대괄호] 표시는 직접 채워야 하는 부분. */
var PROFILE = {
  name: "임세윤",
  role: "AI·비전 엔지니어 지망",
  headline: "시선이 닿지 않는 곳에, 느낄 수 있는 길을 냅니다",
  lead: "시각장애인 커뮤니티 공모전에서 접근성에 관심을 갖게 됐고, 캡스톤에서 저시력자용 탐색 시스템 Lumo로 교내 금상과 논문 투고까지 이어갔습니다. 지금은 Lumo를 스마트폰 앱으로, 몸의 움직임을 읽는 포즈 모델을 스쿼시 코칭으로, 영상을 이해해 촉각으로 바꾸는 작업을 4D 기기로 각각 넓혀가고 있습니다.",
  awards: [

    ["캡스톤 경진대회 장려상", "팀 (Lumo)", "2026"],

/* 구조도 그리는 도우미. 좌표는 viewBox 기준. */
function esc(t){ return String(t).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function bx(x,y,w,h,lines,cls){
  var n=lines.length, total=18+16*(n-1), ty=y+h/2-total/2+13, cx=x+w/2;
  var s='<rect class="'+(cls||"d-box")+'" x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" rx="6"/>';
  lines.forEach(function(t,i){ s+='<text class="'+(i?"d-s":"d-t")+'" x="'+cx+'" y="'+(i?ty+4+16*i:ty)+'" text-anchor="middle">'+esc(t)+'</text>'; });
  return s;
}
function ar(d,id,dash,nohead){ return '<path class="d-a'+(dash?" d-ad":"")+'" d="'+d+'"'+(nohead?"":' marker-end="url(#'+id+')"')+'/>'; }
function lb(x,y,t,cls,anchor){ return '<text class="'+(cls||"d-l")+'" x="'+x+'" y="'+y+'" text-anchor="'+(anchor||"start")+'">'+esc(t)+'</text>'; }
function svg(w,h,id,title,body){
  return '<svg viewBox="0 0 '+w+' '+h+'" role="img" aria-label="'+esc(title)+'"><title>'+esc(title)+'</title><defs><marker id="'+id+'" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="d-ah" d="M0 0L10 5L0 10z"/></marker></defs>'+body+'</svg>';
}
function legend(x,y){ return '<rect class="d-me" x="'+x+'" y="'+(y-11)+'" width="22" height="14" rx="3"/>'+lb(x+30,y,"내가 맡은 부분"); }

var FIG_LUMO = (function(){
  var A="ahL", s="";
  s+='<rect class="d-band" x="0" y="0" width="1040" height="104" rx="8"/>'+lb(14,22,"음성 스레드");
  s+='<rect class="d-band" x="0" y="116" width="1040" height="224" rx="8"/>'+lb(14,138,"비전 스레드");
  s+='<rect class="d-band" x="0" y="352" width="1040" height="100" rx="8"/>'+lb(14,374,"출력 · 종료");
  s+=legend(860,22);
  s+=bx(30,34,150,56,["마이크","상시 청취"]);
  s+=bx(215,34,150,56,["웨이크워드","가벼운 1단계 감지"]);
  s+=bx(400,34,150,56,["Whisper STT","faster-whisper medium"]);
  s+=bx(585,34,150,56,["명사구 추출","불용어 제거 → \"cup\""]);
  s+=ar("M180 62L213 62",A)+ar("M365 62L398 62",A)+ar("M550 62L583 62",A);
  s+=ar("M660 90L660 120L475 120L475 148",A)+lb(672,124,"텍스트 프롬프트");
  s+=bx(30,206,150,56,["RGB-D 카메라","RealSense D455"]);
  s+=bx(400,150,150,56,["YOLOE 분할","오픈 어휘 픽셀 마스크"]);
  s+=bx(585,150,150,56,["마스크 위 깊이","물체 중심 o (3D)"]);
  s+=bx(400,262,150,56,["사람·자세 추정","YOLOv8n-pose 17점"]);
  s+=bx(585,262,150,56,["어깨 몸 좌표계","원점 m, 축 r̂ · f̂"],"d-me");
  s+=bx(790,198,200,72,["몸 기준 방위","θ = atan2(v·r̂, v·f̂)","→ 시계 h · 거리 ‖v‖"],"d-me");
  s+=ar("M180 234L290 234L290 178L398 178",A)+ar("M290 234L290 290L398 290",A);
  s+=ar("M550 178L583 178",A)+ar("M550 290L583 290",A);
  s+=ar("M735 178L762 178L762 234L788 234",A)+ar("M735 290L762 290L762 234",A,false,true);
  s+=bx(700,384,150,56,["음성 안내","\"3시 방향, 1.2미터\""]);
  s+=bx(870,384,150,56,["빛 투사","마스크 → 프로젝터 좌표"]);
  s+=bx(400,384,150,56,["접촉 판정","손목–물체 ≤ 0.15 m"],"d-me");
  s+=ar("M890 270L890 330L775 330L775 382",A)+ar("M890 330L945 330L945 382",A);
  s+=ar("M475 318L475 382",A)+lb(485,356,"손목 키포인트");
  s+=ar("M698 412L552 412",A)+lb(625,404,"안내 중","d-l","middle");
  s+=ar("M398 412L16 412L16 62L28 62",A,true)+lb(207,404,"접촉 → 대기, 마이크 다시 열림","d-la","middle");
  return svg(1040,452,A,"Lumo 시스템 구조도",s);
})();

var FIG_4D = (function(){
  var A="ah4", s="";
  s+=legend(800,30);
  s+=bx(10,205,100,60,["영상 mp4","라벨 없음"]);

   {h:"시스템 구조", fig:FIG_4D, cap:"영상 한 편을 Colab GPU에서 한 번 분석해 track.json을 만들고, 재생 PC는 이 파일만 읽어 BLE로 기기에 명령을 보냅니다. 빨간 점선 안의 지각 층이 제가 맡은 부분입니다."},
   {h:"왜 3층인가", p:["영상과 햅틱 신호가 짝지어진 공개 데이터가 없어서, 영상에서 진동까지를 한 모델로 학습할 수 없습니다. 그래서 인식은 고정된 사전학습 모델과 신호처리에 맡기고, 그 결과를 합쳐 판단하는 결합 층만 소량의 사람 라벨로 학습합니다. 더 좋은 지각 모델이 나오면 결합 층만 다시 학습하면 됩니다.","범위는 오프라인 사전 분석, 제로샷(새 영상마다 라벨링 없음), Colab GPU 1장, 노트북·데스크탑 시청으로 잡았습니다."]},
   {h:"내가 한 일 (영상 분석 · 속도 최적화)", ul:[
     "라벨링 에디터 웹사이트로 효과 5종(순간진동·지속진동·바람·온열·냉각)을 팀원이 나눠 라벨링하는 정답 데이터셋 구축에 참여했습니다.",
     "모델 단독 결과를 분석해 대화 장면에서 순간 진동이 오탐되는 문제(말소리 음량 변화를 충격음으로 오인)를 발견했습니다.",
     "오탐 재학습을 위한 순간 진동 검수, 이후 바람·온도까지 검수 범위를 확장했습니다.",
     "<b>Qwen3-VL 로짓 채점</b> 방식으로 속도를 최적화했습니다: 2분 영상 분석 6분 → 62초 (약 5.8배).",
     "<b>EVS(토큰 프루닝)</b> 적용을 검토했습니다: 안 변하는 픽셀 패치를 미리 제거해 재학습 없이 첫 응답 지연 최대 4배 단축, AUROC 하락 0.02 이내일 때만 채택.",
     "<b>Qwen2.5-Omni</b>(영상+소리 동시 입력) 테스트로 음악·대사 오탐을 완화했습니다: 라벨 기준 럼블 F1 0.47 → 0.68, 음악 구간 진동 274개 → 128개로 감소."]},
   {h:"지각 층 기술 상세 (내 담당)", ul:[
     "<b>장면 의미 · Qwen3-VL-4B</b>: SigLIP-2 비전 인코더 → 연결층 → LLM 구조입니다. 영상을 초당 4프레임(폭 640px)으로 캐시하고, 샷 경계를 넘지 않는 4초 이하 창마다 2~8장을 뽑아 사건 원인·열원·냉기·공기 이동 같은 객관식 관찰 질문 15개에 답하게 합니다.",
     "<b>로짓 채점</b>: 모델에게 문장을 쓰게 하지 않고 선택지(A/B/C/D) 토큰의 확률만 읽습니다. 영상 부분은 한 번만 계산하고 질문 15개를 일괄 처리합니다. 순간적인 사건은 onset이 보완하고, 확률이 한쪽으로 쏠리는 문제는 따로 보정이 필요합니다.",
     "<b>소리 타이밍 · onset 검출</b>: 10ms 간격, 40개 주파수 대역의 에너지 변화로 소리가 시작되는 시각을 ms 단위로 잡습니다.",
     "<b>소리 종류 · PE-A-Frame</b>: 오디오·텍스트 트랜스포머로 40ms마다 12종 약 40개 문장과 비교해 점수를 냅니다. 소리 종류 판단을 넣자 예비 검증 예고편의 진동이 28개에서 14개로 줄었습니다.",
     "<b>움직임 · Farneback 광학 흐름</b>: 픽셀 이동량으로 바람 세기와 화면 흔들림을 잽니다. 학습형 모션 인코더(InternVideo2 등)는 의미는 풍부하지만 T4 GPU에 부담이 커서 가벼운 고전 알고리즘을 골랐습니다.",
     "<b>영상+소리 · Qwen2.5-Omni-3B</b>: 같은 4초 창의 영상과 소리를 함께 넣어 \"가장 큰 소리가 음악·대사인지, 화면 속 사건인지\" 같은 질문 7개의 확률을 읽습니다. 음악·대사 확률이 절반을 넘으면 소리 경로로 켜지는 진동을 끄고, 지속 효과에는 Qwen3-VL과 Omni 점수 중 높은 값을 씁니다. 영상·소리 임베딩 모델 PE-AV도 시험했지만 나아지지 않고 느려서 뺐습니다."]},
   {h:"로짓 채점 파이프라인", chain:[["4fps 캐시","폭 640px로 한 번만 디코딩"],["샷 경계 검출","장면이 바뀌는 곳에서 창을 자름"],["4초 이하 창","창마다 2~8장 선택"],["Qwen3-VL-4B","SigLIP-2 → 연결층 → LLM"],["선택지 로짓만 읽기","A/B/C/D 확률, 질문 15개 일괄"],["시간축 확률","결합 층으로 전달"]], me:true,
     bars:[{cap:"2분 영상 분석 시간 (T4, 예비 검증): 약 5.8배 단축", rows:[["문장 생성",360,"6분"],["로짓 채점",62,"62초"]], max:360, lw:"6.5em"}],
     p2:["114분 영화 한 편을 T4에서 분석하는 데 119.9분(영상 길이의 약 1.05배)이 걸렸고, 그중 77%가 VLM 단계였습니다. 다음 단계로, 바뀌지 않는 픽셀 패치를 모델에 넣기 전에 걸러내는 EVS 토큰 프루닝을 검토하고 있습니다. 재학습 없이 첫 응답 지연을 최대 4배 줄일 수 있고, 질문별 AUROC 하락이 0.02 이내일 때만 채택합니다."]},
   {h:"데이터 루프 (라벨링 → 검수 → 재학습)", chain:[["라벨링 에디터","효과 5종을 타임라인 레인에 구간으로 표시"],["Baseline 출력","가중합 규칙으로 track.json 생성"],["오탐 분석","대사 위주 구간 진동의 79%가 오탐"],["사람 검수","추가·삭제·늘리기·줄이기, 수정 이력 저장"],["재학습","GBDT + HMM (10~11주)"],["평가","포인트 브레이크(114분) 라벨로 1회"]],
     p2:["검수가 데이터 쪽 대응이라면, Omni 추가는 모델 쪽 대응입니다. 둘을 나눠 각각 효과를 확인했습니다."]},
   {h:"Omni 적용 결과", bars:[{cap:"라벨 기준 럼블 F1", rows:[["기존 규칙",0.47,"0.47"],["Omni 적용",0.68,"0.68"]], max:1, lw:"6.5em"},{cap:"음악이 큰 구간에서 켜진 진동 수", rows:[["기존 규칙",274,"274개"],["Omni 적용",128,"128개"]], max:274, lw:"6.5em"}],
     p2:["어느 트랙인지 알리지 않은 블라인드 비교(20초 조각 19개, 평가자 1명)에서도 Omni 쪽이 12 대 6으로 더 많이 선택됐지만, 표본이 작아 유의하지 않아서(p ≈ 0.24) 예비 결과로만 봅니다. 4초 창 하나에 음악과 효과음이 섞이면 창 안의 후보가 모두 같은 판단을 받는 한계가 있어, 진동 후보마다 앞뒤 1초만 Omni에 넣는 방식을 시험하고 있습니다. Omni를 추가하면 4초 창마다 중앙값 1.9초가 더 걸립니다."]},
   {h:"결합 층 · 구동 층 (팀 공동)", ul:[
     "<b>이벤트 선택기</b>: LightGBM 그래디언트 부스팅 트리가 소리 점수와 화면 원인 확률을 onset 단위로 받아 순간 진동을 켤지 정합니다. 과적합을 막으려고 얕은 트리(깊이 3~4), 조기 종료, 합성 데이터 가중치 0.3을 씁니다. 진동 기준값은 배경음악 오탐 5% 이하에서 재현율이 가장 높은 값으로 정합니다.",
     "<b>상태 추적기</b>: 0.5초 구간별 확률을 그대로 쓰면 효과가 깜빡이므로, HMM이 라벨 구간 길이에서 상태 유지 확률(예: 바람 평균 10초 → 켜짐 유지 0.95)을 배우고 비터비 알고리즘으로 구간을 매끄럽게 정합니다.",
     "<b>구동 층</b>: 진동은 수십 ms, 펠티어는 수 초처럼 액추에이터마다 반응 속도가 달라 그만큼 명령을 앞당겨 보내고, 안전한 범위로 제한합니다. track.json에는 진동 이벤트(시각, ERM/LRA, 단발/연사, 세기), 지속 구간, 순간 돌풍, LED 색, 지연을 반영한 전송 시각이 담깁니다.",
     "지금은 학습 모델 대신 소리·화면·영상 이해 점수를 가중합하는 Baseline과 Omni 음악·대사 필터로 동작하고, 검수한 라벨로 학습 모델을 만들어 대체할 예정입니다."]},
   {h:"평가 계획", ul:[
     "진동 재현율·정밀도·F1(±50/100/200 ms), onset 오차 중앙값·p90, 배경음악 오탐률",
     "바람·온냉 구간 정밀도와 전환(깜빡임) 횟수",
     "부품별 지표로 틀렸을 때 어느 부품의 문제인지 추적하고, 부품을 하나씩 빼는 제거 실험",
     "가중합 Baseline·수작업 규칙·사람 상한선과 비교, 영상 단위 교차검증, 부트스트랩 95% 신뢰구간",
     "기기 실측: 진동 onset p90 ≤ 50 ms. 소리와 진동의 어긋남을 알아채는 임계값이 약 88~179 ms로 보고돼 있어 허용 오차를 ±100 ms로 잡았습니다.",
     "테스트셋은 모델 결과를 보지 않고 라벨링하고, 최종 구성으로 한 번만 평가합니다."]},
   {h:"하드웨어 (팀 공동)", p:["핸드 그립(ERM+LRA 진동, 펠티어 온냉, XIAO ESP32-C3), 바람 모듈(80mm PWM 팬+서보, ESP32 DevKit), LED 모듈(SK6812 RGBW 스트립)으로 구성됩니다. 하드웨어는 제가 직접 담당한 부분은 아니며, 11월 초 기준 3D 프린팅·회로 설계가 진행 중입니다."]},
   {h:"현재 단계", p:["2026.11 중간발표 기준, 가중합 Baseline 구현 완료, 순간진동 오탐 확인 및 검수 진행, Omni 기반 음악·대사 필터 테스트를 마쳤습니다. 10~12주차에 재학습·평가, 13~15주차에 하드웨어 연동을 계획하고 있습니다."]},

   {h:"경기 분석 (구현됨)", ul:[

var app = document.getElementById("app");
var CLEAN = false;
CLEAN = true;
try{ var _c = localStorage.getItem("pf-clean"); if(_c!==null) CLEAN = _c==="1"; }catch(e){}
function setClean(v){ CLEAN=v; document.body.classList.toggle("clean",v); try{localStorage.setItem("pf-clean",v?"1":"0")}catch(e){} var b=document.getElementById("cleanbtn"); if(b) b.textContent = v?"작성 메모 보이기":"작성 메모 숨기기"; }

function head(){
  return '<div class="in"><header class="top"><a class="brand" href="#home">'+PROFILE.name+'</a><nav class="nav"><a href="#home">프로젝트</a><a href="'+PROFILE.github+'" target="_blank" rel="noopener">GitHub</a></nav></header></div>';
}
function foot(){
  return '<div class="band"><div class="in"><footer class="end"><span>'+PROFILE.name+' · '+PROFILE.role+'</span><span><button class="link" id="cleanbtn" type="button">'+(CLEAN?"작성 메모 보이기":"작성 메모 숨기기")+'</button> · <a href="'+PROFILE.github+'" target="_blank" rel="noopener">github.com/dlsy4501</a></span></footer></div></div>';
}
function home(){
  var mains = PROJECTS.filter(function(p){return p.main});
  var rest = PROJECTS.filter(function(p){return !p.main});
  var h = head();
  h += '<div class="in hero"><h1>'+PROFILE.headline+'</h1><p class="lead">'+PROFILE.lead+'</p>';
  h += '<dl class="rows">'+PROFILE.awards.map(function(a){return '<div class="row"><dt>'+a[2]+'</dt><dd><b>'+a[0]+'</b><span>'+a[1]+'</span></dd></div>'}).join("")+'</dl></div>';
  h += '<section class="in pad" style="padding-top:24px">';
  h += mains.map(function(p,i){
    var cls = 'work w2' + (i%2 ? ' rev' : '') + (p.cover ? '' : ' nocover');
    var mm = p.cover ? '<img class="cover'+(p.coverFit?' contain':'')+'" loading="lazy" src="'+p.cover+'" alt="'+esc(p.title)+' 대표 이미지">' : '<div class="media">'+p.kind+'</div>';
    return '<a class="'+cls+'" href="#'+p.id+'">'+mm+'<div class="txt"><h2>'+p.title+'</h2><p class="muted">'+p.summary+'</p><div class="stack"><span><b>역할</b> '+p.facts[2][1]+'</span><span><b>기술</b> '+p.tags.join(", ")+'</span><span><b>기간</b> '+p.period+' · '+p.team+'</span></div></div></a>';
  }).join("");
  h += '</section>';
  h += '<div class="band"><section class="in pad"><div class="sechead"><h2>그 밖의 프로젝트</h2></div><div class="list">'+rest.map(function(p){
    return '<a href="#'+p.id+'"><h3>'+p.title+'</h3><p class="muted">'+p.sub+'</p><span class="yr">'+p.period+'</span></a>';
  }).join("")+'</div></section></div>';
  h += '<section class="in pad skills"><div class="sechead"><h2>기술</h2></div><dl class="rows" style="margin-top:0">'+PROFILE.skills.map(function(s){return '<div class="row"><dt>'+s[0]+'</dt><dd>'+s[1]+'</dd></div>'}).join("")+'</dl></section>';
  return h + foot();
}
function paras(a){ return a.map(function(t){return '<p>'+t+'</p>'}).join(""); }
function barsHtml(g){
  var cols = (g.lw||"5em")+' minmax(0,1fr) 5.5em';
  return '<div class="bargroup"><div class="bars">'+g.rows.map(function(r){return '<div class="bar" style="grid-template-columns:'+cols+'"><span>'+r[0]+'</span><i style="width:'+Math.max(0.5,r[1]/g.max*100)+'%"></i><span>'+r[2]+'</span></div>'}).join("")+'</div><p class="small muted">'+g.cap+'</p></div>';
}
function block(b){
  var c = '';
  var cls = 'body';
  var wide = !!(b.fig || b.chain || b.imgs);
  if(b.flow){ cls='body cols'; c += b.flow.map(function(s){return '<div><h3>'+s[0]+'</h3><p>'+s[1]+'</p></div>'}).join(""); }
  if(b.fig){ c += '<div class="fig">'+b.fig+'</div><p class="fighint">옆으로 밀어서 전체를 볼 수 있습니다.</p>'+(b.cap?'<p class="small muted">'+b.cap+'</p>':''); }
  if(b.chain){ c += '<div class="chain">'+b.chain.map(function(s){return '<div class="st'+(b.me?' me':'')+'"><b>'+s[0]+'</b><span>'+s[1]+'</span></div>'}).join('<span class="ar" aria-hidden="true"></span>')+'</div>'; }
  if(b.p) c += paras(b.p);
  if(b.ul) c += '<ul>'+b.ul.map(function(t){return '<li>'+t+'</li>'}).join("")+'</ul>';
  if(b.big){ cls='body res'; c += '<ul>'+b.big.map(function(s){return '<li><b>'+s[0]+'</b> <span class="muted">'+s[1]+'</span></li>'}).join("")+'</ul>'; }
  if(b.table){
    c += '<div class="tw"><table><thead><tr>'+b.table.head.map(function(x){return '<th>'+x+'</th>'}).join("")+'</tr></thead><tbody>'+
      b.table.rows.map(function(r){return '<tr>'+r.map(function(x){return '<td>'+x+'</td>'}).join("")+'</tr>'}).join("")+'</tbody></table></div><p class="small muted">'+b.table.cap+'</p>';
  }
  if(b.bars){ c += [].concat(b.bars).map(barsHtml).join(""); }
  if(b.stack){
    var t=b.stack.total;
    c += '<div class="stk" role="img" aria-label="'+esc(b.stack.cap)+'">'+b.stack.segs.map(function(s){var w=s[1]/t*100; return '<i class="'+s[2]+'" style="width:'+w+'%" title="'+esc(s[0])+' '+s[1]+'s">'+(w>12?s[1].toFixed(2)+'s':'')+'</i>'}).join("")+'</div>';
    c += '<div class="lg">'+b.stack.segs.map(function(s){return '<span><em class="'+s[2]+'"></em>'+s[0]+' <b>'+s[1].toFixed(3)+'s</b></span>'}).join("")+'</div><p class="small muted">'+b.stack.cap+'</p>';
  }
  if(b.p2) c += paras(b.p2);
  if(b.imgs){ c += '<div class="shots">'+b.imgs.map(function(m){return '<figure><img loading="lazy" src="'+m[0]+'" alt="'+esc(m[1])+'"><figcaption>'+m[1]+'</figcaption></figure>'}).join('')+'</div>'; }
  if(b.ph){ cls='body pair'; c += b.ph.map(function(t){return '<div class="media">'+t+'</div>'}).join(""); }
  return '<div class="sec'+(wide?' wide':'')+'"><h2>'+b.h+'</h2><div class="'+cls+'">'+c+'</div></div>';
}
function detail(p){
  var h = head();
  h += '<div class="in"><a class="back" href="#home">프로젝트 목록</a><div class="dhead"><h1>'+p.title+'</h1><p class="lead">'+p.sub+'</p>';
  h += '<dl class="rows" style="margin-top:40px">'+p.facts.map(function(f){return '<div class="row"><dt>'+f[0]+'</dt><dd>'+f[1]+'</dd></div>'}).join("")+'</dl></div>';
  h += p.blocks.filter(function(b){return b.imgs}).concat(p.blocks.filter(function(b){return !b.imgs})).map(block).join("");
  if(p.todo) h += '<div class="memo" style="margin-top:40px"><b>작성 메모</b> '+p.todo+'</div>';
  var i = PROJECTS.indexOf(p), nx = PROJECTS[(i+1)%PROJECTS.length];
  h += '<a class="next" href="#'+nx.id+'"><small>다음 프로젝트</small><h2>'+nx.title+'</h2></a><div style="height:64px"></div></div>';
  return h + foot();
}
function route(){
  var id = (location.hash||"").replace("#","");
  var p = PROJECTS.filter(function(x){return x.id===id})[0];
  app.innerHTML = p ? detail(p) : home();
  document.title = p ? p.title+" · "+PROFILE.name : PROFILE.name+" 포트폴리오";
  document.body.classList.toggle("clean",CLEAN);
  var b=document.getElementById("cleanbtn"); if(b) b.onclick=function(){setClean(!CLEAN)};
  window.scrollTo(0,0);
}
window.addEventListener("hashchange", route);
route();
</script>
